    <script>
      // Antes del primer pintado: marca JS activo y decide si el preloader se muestra.
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        try {
          if (sessionStorage.getItem('ch-seen') || matchMedia('(prefers-reduced-motion: reduce)').matches) {
            d.classList.add('no-preloader')
          } else {
            sessionStorage.setItem('ch-seen', '1')
            d.classList.add('loading')
            // Red de seguridad: si el JS no llega, el preloader se retira igual.
            setTimeout(function () {
              d.classList.remove('loading')
              d.classList.add('no-preloader')
            }, 2500)
          }
        } catch (e) {
          d.classList.add('no-preloader')
        }
      })()
    </script>
